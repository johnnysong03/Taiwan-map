<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺灣地圖集</title>
<meta name="description" content="臺灣建築地圖與臺灣地熱地圖：古蹟、歷史建築、地號查詢與地熱探勘開放資料。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
  :root{--paper:#f1e4c8;--ink:#3a2a1a;--muted:#7a6447;--red:#b0302a;--line:#3a2a1a}
  @media (prefers-color-scheme: dark){:root{--paper:#1f1a14;--ink:#eadcc0;--muted:#b09a7a;--red:#e0705f;--line:#eadcc0}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC",serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{max-width:720px;width:100%;border:3px double var(--line);padding:32px 28px}
  h1{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:.2em;margin:0}
  .sub{color:var(--muted);letter-spacing:.15em;font-size:13px;margin:6px 0 28px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.card{display:block;border:1px solid var(--line);padding:20px;color:inherit;text-decoration:none;transition:background .15s}
  a.card:hover{background:rgba(176,48,42,.08)}
  a.card h2{margin:0 0 8px;font-size:22px;letter-spacing:.12em;color:var(--red)}
  a.card p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
  footer{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>臺灣地圖集</h1>
  <div class="sub">TAIWAN MAP ATLAS</div>
  <div class="cards">
    <a class="card" href="taiwan-architecture.html">
      <h2>臺灣建築地圖 →</h2>
      <p>精選建築與國家文化資產網 2,846 件古蹟、歷史建築；臺北市地號查詢與土地權屬統計。<br>Architecture &amp; heritage map</p>
    </a>
    <a class="card" href="taiwan-geothermal.html">
      <h2>臺灣地熱地圖 →</h2>
      <p>地熱探勘資訊平臺 92 組開放資料：地熱井、溫泉露頭、水化學、大地電磁等，可匯出 KML。<br>Geothermal exploration map</p>
    </a>
  </div>
  <footer>底圖與圖資：內政部國土測繪中心。文化資產：文化部文化資產局國家文化資產網。地熱：經濟部地質調查及礦業管理中心地熱探勘資訊平臺。</footer>
</main>
</body>
</html>
